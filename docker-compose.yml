services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./artifacts:/srv/app/artifacts
      - ./data/policies:/srv/app/data/policies:ro
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
