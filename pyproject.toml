[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "online-deanery"
version = "0.1.0"
description = "Evidence-grounded student document intake and policy Q&A API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0", "pydantic-settings>=2.4,<3.0", "python-multipart>=0.0.9", "Pillow>=10.4", "pytesseract>=0.3.13", "scikit-learn>=1.5", "numpy>=1.26"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]
benchmark = ["datasets>=3.0", "jiwer>=3.0"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
