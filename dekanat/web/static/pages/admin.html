<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Администратор — Онлайн-деканат</title>
  <link rel="icon" href="/static/pages/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/pages/pages.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <header class="top">
    <div class="island">
      <a class="brand" href="/" aria-label="Онлайн-деканат — на стол">
        <img src="/static/pages/logo.svg" alt="" width="40" height="40">
        <span class="brand-text"><strong>Онлайн-деканат</strong><small>Для сотрудников деканата</small></span>
      </a>
      <nav aria-label="Разделы">
        <a href="/">Стол декана</a>
        <a href="/admin" aria-current="page">Сотрудникам</a>
      </nav>
      <span id="who"></span>
      <button id="btn-logout" type="button" class="small hidden">Выйти</button>
      <button id="theme-btn" class="round-btn" type="button" aria-label="Сменить тему" title="Сменить тему"></button>
    </div>
  </header>

  <main>
    <div id="banner"></div>

    <section id="login" class="card login hidden" aria-labelledby="login-title">
      <div class="seal"><img src="/static/pages/logo.svg" alt="" width="56" height="56"></div>
      <h2 id="login-title">Вход для сотрудников</h2>
      <form id="login-form" autocomplete="on">
        <label for="u">Логин</label>
        <input id="u" type="text" autocomplete="username" required>
        <label for="p">Пароль</label>
        <input id="p" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Войти</button>
      </form>
      <p class="muted">Учётную запись администратора создаёт ответственный за сервер командой <code>python -m dekanat create-admin</code>. Пароля по умолчанию не существует.</p>
    </section>

    <div id="app" class="hidden">
      <div class="tabs" role="tablist" aria-label="Разделы администратора" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </main>
  <script src="/static/pages/common.js"></script>
  <script src="/static/pages/admin.js"></script>
</body>
</html>
